<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>Billetera Ordenada - Logo 2</title>

  <!-- Background circle deep green -->
  <circle cx="540" cy="540" r="480" fill="#173404"/>
  <circle cx="540" cy="540" r="432" fill="none" stroke="#27500A" stroke-width="2"/>
  <circle cx="540" cy="540" r="384" fill="none" stroke="#27500A" stroke-width="1"/>

  <!-- Stacked cards -->
  <!-- Card 3 (back) -->
  <rect x="372" y="348" width="336" height="234" rx="32" fill="none" stroke="#639922" stroke-width="3" opacity="0.6"/>
  <!-- Card 2 (middle) -->
  <rect x="400" y="372" width="336" height="234" rx="32" fill="none" stroke="#639922" stroke-width="3" opacity="0.4"/>
  <!-- Card 1 (front) -->
  <rect x="428" y="396" width="336" height="234" rx="32" fill="#3B6D11"/>
  <rect x="428" y="396" width="336" height="234" rx="32" fill="none" stroke="#97C459" stroke-width="3"/>

  <!-- Chip -->
  <rect x="476" y="442" width="60" height="44" rx="8" fill="#EF9F27" opacity="0.9"/>
  <line x1="476" y1="464" x2="536" y2="464" stroke="#BA7517" stroke-width="2"/>
  <line x1="506" y1="442" x2="506" y2="486" stroke="#BA7517" stroke-width="2"/>

  <!-- Contactless -->
  <path d="M586 442 Q608 464 586 486" fill="none" stroke="#EAF3DE" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M602 432 Q632 464 602 496" fill="none" stroke="#EAF3DE" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M618 422 Q656 464 618 506" fill="none" stroke="#EAF3DE" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

  <!-- Checklist items -->
  <!-- Item 1 checked -->
  <circle cx="436" cy="554" r="14" fill="#97C459"/>
  <path d="M428 554 L434 561 L446 547" fill="none" stroke="#173404" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="458" y="546" width="230" height="14" rx="7" fill="#97C459"/>

  <!-- Item 2 -->
  <circle cx="436" cy="590" r="14" fill="#3B6D11" stroke="#639922" stroke-width="2"/>
  <rect x="458" y="582" width="172" height="14" rx="7" fill="#639922"/>

  <!-- Item 3 -->
  <circle cx="436" cy="626" r="14" fill="#3B6D11" stroke="#639922" stroke-width="2" opacity="0.6"/>
  <rect x="458" y="618" width="200" height="14" rx="7" fill="#639922" opacity="0.6"/>

  <!-- Brand name -->
  <text x="540" y="756" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="13" fill="#97C459" opacity="0.8">BILLETERA</text>
  <text x="540" y="812" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="3" fill="#EAF3DE">ORDENADA</text>

  <!-- Underline -->
  <rect x="446" y="832" width="190" height="3" rx="1.5" fill="#97C459" opacity="0.5"/>

  <!-- Side dots -->
  <circle cx="278" cy="540" r="6" fill="#97C459" opacity="0.4"/>
  <circle cx="802" cy="540" r="6" fill="#97C459" opacity="0.4"/>
</svg>
