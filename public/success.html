<script>
// Al cargar la página, intentar enviar mail automáticamente
window.addEventListener("DOMContentLoaded", async function() {
  const params = new URLSearchParams(window.location.search);
  const preferenceId = params.get("preference_id");
  const status = params.get("status");

  if (preferenceId && status === "approved") {
    try {
      await fetch("/confirmar-pago?preference_id=" + preferenceId + "&status=" + status);
      document.getElementById("mensaje-auto").style.display = "block";
    } catch(e) {
      console.log("Error confirmando pago:", e);
    }
  }
});

async function enviarMail() {
  const nombre = document.getElementById("nombre").value.trim();
  const email = document.getElementById("email").value.trim();
  const btn = document.getElementById("btn-enviar");

  if (!nombre || !email) {
    alert("Por favor completa tu nombre y email.");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Enviando...";

  try {
    const url = "/enviar-kit?nombre=" + encodeURIComponent(nombre) + "&email=" + encodeURIComponent(email);
    const response = await fetch(url);
    const data = await response.json();

    if (data.ok) {
      document.getElementById("mensaje").style.display = "block";
      btn.innerText = "Enviado!";
    } else {
      alert("Hubo un problema. Intenta de nuevo.");
      btn.disabled = false;
      btn.innerText = "Enviarme el kit por email";
    }
  } catch (error) {
    alert("Hubo un problema. Intenta de nuevo.");
    btn.disabled = false;
    btn.innerText = "Enviarme el kit por email";
  }
}
</script>
